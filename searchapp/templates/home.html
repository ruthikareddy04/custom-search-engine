<!DOCTYPE html>
<html>
<head>
    <title>Custom Search Engine</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#4facfe,#00c6fb,#43e97b);
            background-size:400% 400%;
            animation:gradient 10s ease infinite;
        }

        @keyframes gradient{
            0%{background-position:0% 50%;}
            50%{background-position:100% 50%;}
            100%{background-position:0% 50%;}
        }

        .card{
            width:600px;
            background:white;
            padding:50px;
            border-radius:20px;
            text-align:center;
            box-shadow:0 15px 35px rgba(0,0,0,.25);
        }

        h1{
            font-size:40px;
            margin-bottom:15px;
            color:#333;
        }

        p{
            color:#666;
            margin-bottom:35px;
        }

        .btn{
            display:block;
            margin:15px 0;
            padding:15px;
            border-radius:10px;
            text-decoration:none;
            color:white;
            font-size:18px;
            transition:.3s;
        }

        .btn:hover{
            transform:scale(1.03);
        }

        .search{
            background:#2196f3;
        }

        .index{
            background:#4caf50;
        }

        .analytics{
            background:#ff9800;
        }
    </style>

</head>

<body>

<div class="card">

    <h1>🔍 Custom Search Engine</h1>

    <p>Search • Index Websites • View Analytics</p>

    <a href="/search/" class="btn search">🔎 Search Engine</a>

    <a href="/index/" class="btn index">🌐 Index Website</a>

    <a href="/analytics/" class="btn analytics">📊 Analytics Dashboard</a>

</div>

</body>
</html>
