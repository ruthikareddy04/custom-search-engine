<!DOCTYPE html>
<html>
<head>
    <title>Analytics Dashboard</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,Helvetica,sans-serif;
        }

        body{
            background:linear-gradient(135deg,#4facfe,#00c6fb,#43e97b);
            min-height:100vh;
            padding:40px;
        }

        h1{
            text-align:center;
            color:white;
            margin-bottom:40px;
        }

        .cards{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:20px;
        }

        .card{
            background:white;
            padding:30px;
            border-radius:15px;
            text-align:center;
            box-shadow:0 10px 20px rgba(0,0,0,.2);
        }

        .card h2{
            color:#555;
            margin-bottom:15px;
        }

        .card h1{
            color:#2196f3;
            margin:0;
        }

        table{
            width:100%;
            margin-top:40px;
            border-collapse:collapse;
            background:white;
            border-radius:10px;
            overflow:hidden;
        }

        th{
            background:#2196f3;
            color:white;
            padding:15px;
        }

        td{
            padding:12px;
            text-align:center;
            border-bottom:1px solid #ddd;
        }

        a{
            display:inline-block;
            margin-top:30px;
            text-decoration:none;
            color:white;
            background:#ff9800;
            padding:12px 25px;
            border-radius:10px;
        }

    </style>

</head>

<body>

<h1>📊 Analytics Dashboard</h1>

<div class="cards">

<div class="card">
<h2>Total Documents</h2>
<h1>{{ total_documents }}</h1>
</div>

<div class="card">
<h2>Total Terms</h2>
<h1>{{ total_terms }}</h1>
</div>

<div class="card">
<h2>Total Searches</h2>
<h1>{{ total_searches }}</h1>
</div>

</div>

<table>

<tr>
<th>Top Search Query</th>
<th>Search Count</th>
</tr>

{% for item in top_searches %}

<tr>
<td>{{ item.query }}</td>
<td>{{ item.count }}</td>
</tr>

{% empty %}

<tr>
<td colspan="2">
No searches available
</td>
</tr>

{% endfor %}

</table>

<a href="/">🏠 Home</a>

</body>
</html>
